name: Linux Desktop (AppImage + tar.gz)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - 'androidApp/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'androidApp/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-desktop:
    name: Linux AppImage + portable tar.gz (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY || '' }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || vars.FIREBASE_AUTH_DOMAIN || '' }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || '' }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || vars.FIREBASE_STORAGE_BUCKET || '' }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID || '' }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || vars.FIREBASE_APP_ID || '' }}
      FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID || vars.FIREBASE_MEASUREMENT_ID || '' }}
      APP_SECRET: ${{ secrets.APP_SECRET || vars.APP_SECRET || '' }}
      PAYLOAD_KEY: ${{ secrets.PAYLOAD_KEY || vars.PAYLOAD_KEY || '' }}

      JATIM_ID: ${{ secrets.JATIM_ID || vars.JATIM_ID || 'jatim' }}
      JATIM_NAME: ${{ secrets.JATIM_NAME || vars.JATIM_NAME || 'Provinsi Jawa Timur' }}
      JATIM_LABEL: ${{ secrets.JATIM_LABEL || vars.JATIM_LABEL || 'Presensi Jatimprov' }}
      JATIM_GATEWAY_URL: ${{ secrets.JATIM_GATEWAY_URL || vars.JATIM_GATEWAY_URL || '' }}
      JATIM_EP_BASE_URL: ${{ secrets.JATIM_EP_BASE_URL || vars.JATIM_EP_BASE_URL || '' }}
      JATIM_MODE: ${{ secrets.JATIM_MODE || vars.JATIM_MODE || 'bkd-rpc' }}
      JATIM_REQUIRES_PHOTO: ${{ secrets.JATIM_REQUIRES_PHOTO || vars.JATIM_REQUIRES_PHOTO || 'false' }}
      JATIM_REQUIRES_WORKCODE: ${{ secrets.JATIM_REQUIRES_WORKCODE || vars.JATIM_REQUIRES_WORKCODE || 'true' }}

      MADIUN_ID: ${{ secrets.MADIUN_ID || vars.MADIUN_ID || 'madiun' }}
      MADIUN_NAME: ${{ secrets.MADIUN_NAME || vars.MADIUN_NAME || 'Kabupaten Madiun' }}
      MADIUN_LABEL: ${{ secrets.MADIUN_LABEL || vars.MADIUN_LABEL || 'Presensi Madiunkab' }}
      MADIUN_GATEWAY_URL: ${{ secrets.MADIUN_GATEWAY_URL || vars.MADIUN_GATEWAY_URL || '' }}
      MADIUN_EP_BASE_URL: ${{ secrets.MADIUN_EP_BASE_URL || vars.MADIUN_EP_BASE_URL || '' }}
      MADIUN_MODE: ${{ secrets.MADIUN_MODE || vars.MADIUN_MODE || 'bkd-rpc' }}
      MADIUN_REQUIRES_PHOTO: ${{ secrets.MADIUN_REQUIRES_PHOTO || vars.MADIUN_REQUIRES_PHOTO || 'false' }}
      MADIUN_REQUIRES_WORKCODE: ${{ secrets.MADIUN_REQUIRES_WORKCODE || vars.MADIUN_REQUIRES_WORKCODE || 'true' }}

      PONOROGO_ID: ${{ secrets.PONOROGO_ID || vars.PONOROGO_ID || 'ponorogo' }}
      PONOROGO_NAME: ${{ secrets.PONOROGO_NAME || vars.PONOROGO_NAME || 'Kabupaten Ponorogo' }}
      PONOROGO_LABEL: ${{ secrets.PONOROGO_LABEL || vars.PONOROGO_LABEL || 'Presensi Ponorogo' }}
      PONOROGO_GATEWAY_URL: ${{ secrets.PONOROGO_GATEWAY_URL || vars.PONOROGO_GATEWAY_URL || '' }}
      PONOROGO_EP_BASE_URL: ${{ secrets.PONOROGO_EP_BASE_URL || vars.PONOROGO_EP_BASE_URL || '' }}
      PONOROGO_MODE: ${{ secrets.PONOROGO_MODE || vars.PONOROGO_MODE || 'ponorogo-absensi' }}
      PONOROGO_REQUIRES_PHOTO: ${{ secrets.PONOROGO_REQUIRES_PHOTO || vars.PONOROGO_REQUIRES_PHOTO || 'true' }}
      PONOROGO_REQUIRES_WORKCODE: ${{ secrets.PONOROGO_REQUIRES_WORKCODE || vars.PONOROGO_REQUIRES_WORKCODE || 'false' }}
      PONOROGO_API_BASE: ${{ secrets.PONOROGO_API_BASE || vars.PONOROGO_API_BASE || '' }}
      PONOROGO_IMAGE_BASE: ${{ secrets.PONOROGO_IMAGE_BASE || vars.PONOROGO_IMAGE_BASE || '' }}

      LOCAL_API_PORT: ${{ secrets.LOCAL_API_PORT || vars.LOCAL_API_PORT || '14200' }}
      PRESENSI_ALLOWED_HOSTS: ${{ secrets.PRESENSI_ALLOWED_HOSTS || vars.PRESENSI_ALLOWED_HOSTS || '' }}
      PRESENSI_DEFAULT_GATEWAY_URL: ${{ secrets.PRESENSI_DEFAULT_GATEWAY_URL || vars.PRESENSI_DEFAULT_GATEWAY_URL || '' }}
      PRESENSI_DEFAULT_EP_BASE_URL: ${{ secrets.PRESENSI_DEFAULT_EP_BASE_URL || vars.PRESENSI_DEFAULT_EP_BASE_URL || '' }}
      TETUKO_OCR_URL: ${{ secrets.TETUKO_OCR_URL || vars.TETUKO_OCR_URL || '' }}
      TETUKO_OCR_MODEL: ${{ secrets.TETUKO_OCR_MODEL || vars.TETUKO_OCR_MODEL || '' }}
      TETUKO_OCR_CHARSET: ${{ secrets.TETUKO_OCR_CHARSET || vars.TETUKO_OCR_CHARSET || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify required OCR assets are present
        run: |
          test -f app-resources/ocr/ocr_model.onnx
          test -f app-resources/ocr/ocr_charset.json

      - name: Read app version
        id: app
        run: |
          VERSION=$(grep -E '^app\.versionName=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Run Linux/desktop tests
        run: ./gradlew :proxyServer:test :composeApp:desktopTest --console=plain --no-configuration-cache

      - name: Verify desktop compilation
        run: ./gradlew :composeApp:compileKotlinDesktop :desktopApp:compileKotlinJvm --console=plain --no-configuration-cache

      - name: Generate runtime .env for bundle (from CI env)
        run: |
          set -euo pipefail
          cat > .env <<EOF
          # TETUKO runtime config (dibundel dari GitHub Secrets/Variables via CI)
          FIREBASE_API_KEY=${FIREBASE_API_KEY}
          FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
          FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
          FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
          FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
          FIREBASE_APP_ID=${FIREBASE_APP_ID}
          FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID}
          APP_SECRET=${APP_SECRET}
          PAYLOAD_KEY=${PAYLOAD_KEY}

          JATIM_ID=${JATIM_ID}
          JATIM_NAME=${JATIM_NAME}
          JATIM_LABEL=${JATIM_LABEL}
          JATIM_GATEWAY_URL=${JATIM_GATEWAY_URL}
          JATIM_EP_BASE_URL=${JATIM_EP_BASE_URL}
          JATIM_MODE=${JATIM_MODE}
          JATIM_REQUIRES_PHOTO=${JATIM_REQUIRES_PHOTO}
          JATIM_REQUIRES_WORKCODE=${JATIM_REQUIRES_WORKCODE}

          MADIUN_ID=${MADIUN_ID}
          MADIUN_NAME=${MADIUN_NAME}
          MADIUN_LABEL=${MADIUN_LABEL}
          MADIUN_GATEWAY_URL=${MADIUN_GATEWAY_URL}
          MADIUN_EP_BASE_URL=${MADIUN_EP_BASE_URL}
          MADIUN_MODE=${MADIUN_MODE}
          MADIUN_REQUIRES_PHOTO=${MADIUN_REQUIRES_PHOTO}
          MADIUN_REQUIRES_WORKCODE=${MADIUN_REQUIRES_WORKCODE}

          PONOROGO_ID=${PONOROGO_ID}
          PONOROGO_NAME=${PONOROGO_NAME}
          PONOROGO_LABEL=${PONOROGO_LABEL}
          PONOROGO_GATEWAY_URL=${PONOROGO_GATEWAY_URL}
          PONOROGO_EP_BASE_URL=${PONOROGO_EP_BASE_URL}
          PONOROGO_MODE=${PONOROGO_MODE}
          PONOROGO_REQUIRES_PHOTO=${PONOROGO_REQUIRES_PHOTO}
          PONOROGO_REQUIRES_WORKCODE=${PONOROGO_REQUIRES_WORKCODE}
          PONOROGO_API_BASE=${PONOROGO_API_BASE}
          PONOROGO_IMAGE_BASE=${PONOROGO_IMAGE_BASE}

          LOCAL_API_PORT=${LOCAL_API_PORT}
          PRESENSI_ALLOWED_HOSTS=${PRESENSI_ALLOWED_HOSTS}
          PRESENSI_DEFAULT_GATEWAY_URL=${PRESENSI_DEFAULT_GATEWAY_URL}
          PRESENSI_DEFAULT_EP_BASE_URL=${PRESENSI_DEFAULT_EP_BASE_URL}
          TETUKO_OCR_URL=${TETUKO_OCR_URL}
          TETUKO_OCR_MODEL=${TETUKO_OCR_MODEL}
          TETUKO_OCR_CHARSET=${TETUKO_OCR_CHARSET}
          EOF
          echo "Runtime .env generated from CI env (values not printed)"

      - name: Package Linux AppImage (Compose Desktop)
        run: ./gradlew :desktopApp:packageComposeAppImage --no-configuration-cache --console=plain

      - name: Package portable tar.gz
        run: |
          set -euo pipefail
          VERSION="${{ steps.app.outputs.version }}"
          APP_DIR=""
          for base in desktopApp/build/compose/binaries/main-release/app desktopApp/build/compose/binaries/main/app; do
            if [ -d "$base" ]; then
              APP_DIR=$(find "$base" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n1)
              [ -n "$APP_DIR" ] && break
            fi
          done
          if [ -z "$APP_DIR" ]; then
            echo "::error::Compose Desktop app directory tidak ditemukan"
            find desktopApp/build/compose/binaries -maxdepth 4 -type d || true
            exit 1
          fi
          OUTDIR="${RUNNER_TEMP}/tetuko-pkg"
          rm -rf "$OUTDIR"
          mkdir -p "$OUTDIR" dist
          cp -a "$APP_DIR" "$OUTDIR/tetuko"
          chmod +x "$OUTDIR/tetuko/bin/"* 2>/dev/null || true
          [ -f .env.example ] && cp .env.example "$OUTDIR/tetuko/" || true
          TAR_NAME="TETUKO-${VERSION}-linux-x64.tar.gz"
          tar -C "$OUTDIR" -cf - tetuko | gzip -9 > "dist/${TAR_NAME}"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"

      - name: Collect AppImage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find desktopApp/build/compose/binaries/main-release -name "*.AppImage" -type f -exec cp -v {} dist/ \; || true
          find desktopApp/build/compose/binaries/main -name "*.AppImage" -type f -exec cp -v {} dist/ \; || true
          find desktopApp/build/appimage -name "*.AppImage" -type f -exec cp -v {} dist/ \; || true
          echo "--- dist/ ---"; ls -lah dist || true

      - name: Verify AppImage structure
        run: |
          set -euo pipefail
          appimage="$(find dist -maxdepth 1 -name '*.AppImage' -type f | sed -n '1p')"
          if [ -z "$appimage" ]; then
            echo "::error::No AppImage produced by packaging step"; exit 1
          fi
          file "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -n "$(find squashfs-root -maxdepth 3 -name '*.desktop' | sed -n '1p')"
          echo "AppImage structure OK: $appimage"
          rm -rf squashfs-root

      - name: Verify tar.gz structure
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -type f | sed -n '1p')"
          if [ -z "$archive" ]; then
            echo "::error::No tar.gz produced by packaging step"; exit 1
          fi
          tar -tzf "$archive" > "${RUNNER_TEMP}/tar-list.txt"
          grep -q 'tetuko/bin/TETUKO' "${RUNNER_TEMP}/tar-list.txt"
          echo "tar.gz structure OK: $archive"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetuko-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetuko-linux-x64-tar-gz
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
