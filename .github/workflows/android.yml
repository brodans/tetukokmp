name: Android (Debug + Release APK)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - 'desktopApp/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/linux.yml'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'desktopApp/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/linux.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (debug and release)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY || '' }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || vars.FIREBASE_AUTH_DOMAIN || '' }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || '' }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || vars.FIREBASE_STORAGE_BUCKET || '' }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID || '' }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || vars.FIREBASE_APP_ID || '' }}
      FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID || vars.FIREBASE_MEASUREMENT_ID || '' }}
      APP_SECRET: ${{ secrets.APP_SECRET || vars.APP_SECRET || '' }}
      PAYLOAD_KEY: ${{ secrets.PAYLOAD_KEY || vars.PAYLOAD_KEY || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate google-services.json (from CI secrets)
        run: |
          cat > androidApp/google-services.json <<JSON
          {
            "project_info": {
              "project_number": "${FIREBASE_MESSAGING_SENDER_ID}",
              "project_id": "${FIREBASE_PROJECT_ID}",
              "storage_bucket": "${FIREBASE_STORAGE_BUCKET}"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "${FIREBASE_APP_ID}",
                  "android_client_info": { "package_name": "id.tetuko.app" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "${FIREBASE_API_KEY}" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          cp androidApp/google-services.json google-services.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Run Android unit tests (best effort)
        run: ./gradlew :androidApp:testDebugUnitTest --console=plain --no-configuration-cache
        continue-on-error: true

      - name: Assemble Android debug
        run: ./gradlew :androidApp:assembleDebug --console=plain --no-configuration-cache

      - name: Assemble Android release
        run: ./gradlew :androidApp:assembleRelease --console=plain --no-configuration-cache

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tetuko-android-apk
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
