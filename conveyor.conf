// TETUKO - Conveyor packaging (modeled after SimpMusic)
// Run `./gradlew :desktopApp:writeConveyorConfig` before invoking conveyor.
include required("desktopApp/generated.conveyor.conf")

app {
  vendor = "TETUKO"
  description = "TETUKO - Teknologi Terpadu Komprehensif"
  license = "Proprietary"
  vcs-url = "https://github.com/brodans/tetukokmp"

  icons = "app-resources/icons/icon.png"

  updates = none
  site.consistency-checks = warn
  url-schemes = [ "tetuko" ]

  machines = [
    "linux.amd64.glibc",
    "windows.amd64",
  ]

  linux.amd64.targets = [ ]
  linux {
    desktop-file."Desktop Entry" {
      "Comment[en]" = "TETUKO - Teknologi Terpadu Komprehensif"
      Categories = "Office;Network;Utility;"
      StartupWMClass = "TETUKO"
    }
  }

  compression-level = low
  jvm {
    modules = "ALL-MODULE-PATH"
    options += "-Xmx512m"
  }
}

conveyor.compatibility-level = 14
conveyor.disk-cache.minimum-free-disk-space = 1 GB
