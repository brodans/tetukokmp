[versions]
version-name = "1.0.0"
version-code = "1"

kotlin = "2.1.20"
agp = "8.7.3"
compose-multiplatform = "1.7.3"
coroutines = "1.10.1"
serialization = "1.8.0"
ktor = "3.1.1"
koin = "4.0.2"
androidx-lifecycle = "2.8.4"
androidx-activity = "1.10.1"
androidx-core = "1.15.0"
androidx-exifinterface = "1.3.7"
datastore = "1.1.3"
navigation-compose = "2.8.0-alpha11"
